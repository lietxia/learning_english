<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="基于词根词缀规律的英语四级、六级单词记忆网站">
  <title>词根图谱 · 四六级规律记忆</title>

  <!-- Bootstrap 6 alpha（CSS） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- 站点样式：主题变量 + 词根卡片等定制部分 -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ============ 顶栏 ============ -->
  <header class="app-header">
    <div class="container-fluid">
      <div class="d-flex align-items-center justify-content-between gap-3 py-3">
        <div class="d-flex align-items-center gap-3">
          <span class="brand-mark">R</span>
          <div>
            <div class="brand-title">词根图谱</div>
            <div class="brand-sub">CET-4 / CET-6 · 规律记忆系统</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary icon-btn" type="button" title="切换明暗主题" aria-label="切换明暗主题">
            <i class="bi bi-sun"></i>
          </button>
          <button class="btn btn-sm btn-primary" type="button" data-goto="review">
            <i class="bi bi-clock-history"></i> 今日复习
            <span id="dueBadge" class="count-badge">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ 主体：侧栏 + 内容 ============ -->
  <div class="container-fluid app-shell">
    <div class="row g-0">

      <!-- 侧边导航 -->
      <aside class="col-12 lg:col-2 app-sidebar">
        <nav class="nav flex-column app-nav" id="mainNav" aria-label="主导航">
          <button class="nav-link active" type="button" data-view="home"><i class="bi bi-grid-1x2"></i><span>总览</span></button>
          <button class="nav-link" type="button" data-view="roots"><i class="bi bi-diagram-3"></i><span>词根图谱</span></button>
          <button class="nav-link" type="button" data-view="allroots"><i class="bi bi-diagram-3"></i><span>完整词根库</span></button>
          <button class="nav-link" type="button" data-view="words"><i class="bi bi-journal-text"></i><span>四六级词库</span></button>
          <button class="nav-link" type="button" data-view="phrases"><i class="bi bi-chat-square-text"></i><span>词组学习</span></button>
          <button class="nav-link" type="button" data-view="affixes"><i class="bi bi-puzzle"></i><span>词缀速查</span></button>
          <button class="nav-link" type="button" data-view="themes"><i class="bi bi-collection"></i><span>主题词场</span></button>
          <button class="nav-link" type="button" data-view="confuse"><i class="bi bi-shuffle"></i><span>易混词对比</span></button>
          <button class="nav-link" type="button" data-view="review"><i class="bi bi-repeat"></i><span>间隔复习</span></button>
          <button class="nav-link" type="button" data-view="quiz"><i class="bi bi-patch-question"></i><span>快速测验</span></button>
          <button class="nav-link" type="button" data-view="methods"><i class="bi bi-lightbulb"></i><span>记忆法指南</span></button>
          <button class="nav-link" type="button" data-view="etymology"><i class="bi bi-git"></i><span>词源逻辑图谱</span></button>
          <button class="nav-link" type="button" data-view="polysemy"><i class="bi bi-layers"></i><span>一词多义速查</span></button>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-stat"><span id="sideLearned">0</span><small>已掌握</small></div>
          <div class="sidebar-stat"><span id="sideTotal">0</span><small>总词数</small></div>
        </div>
        <p class="sidebar-hint">进度保存在本机浏览器，无需登录。</p>
      </aside>

      <!-- 内容区 -->
      <main class="col-12 lg:col-10 app-main">
        <section id="view-home" class="view"></section>
        <section id="view-roots" class="view d-none"></section>
        <section id="view-allroots" class="view d-none"></section>
        <section id="view-words" class="view d-none"></section>
        <section id="view-phrases" class="view d-none"></section>
        <section id="view-affixes" class="view d-none"></section>
        <section id="view-themes" class="view d-none"></section>
        <section id="view-confuse" class="view d-none"></section>
        <section id="view-review" class="view d-none"></section>
        <section id="view-quiz" class="view d-none"></section>
        <section id="view-methods" class="view d-none"></section>
        <section id="view-etymology" class="view d-none"></section>
        <section id="view-polysemy" class="view d-none"></section>
      </main>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast-stack" id="toastHost" aria-live="polite"></div>

  <!-- 词库数据（普通脚本，挂到 window.LE_DATA / window.LE_DETAIL） -->
  <script src="js/data.js"></script>
  <script src="js/data-detail.js"></script>
  <script src="js/data-gloss.js"></script>
  <!-- 应用逻辑：原生 ES Module，无构建步骤 -->
  <script type="module">
    // Bootstrap 6 alpha 的 JavaScript 为 ESM，按需加载；加载失败不影响本站核心功能。
    import('https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js').catch(() => {});
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
